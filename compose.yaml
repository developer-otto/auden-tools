services:
  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - conversions:/data/conversions
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
      - /app/apps/web/.next/cache:size=256m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128
  worker:
    build:
      context: .
      target: worker
    volumes:
      - conversions:/data/conversions
    restart: unless-stopped
    init: true
    # Conversion engines have no network access, including document links.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
volumes:
  conversions:
